name: CI

# `push` solo en la rama principal: en una rama con pull request ya corre el de `pull_request`, y con los
# dos se ejecutaba todo dos veces. Si tu rama principal no se llama main ni master, cámbialo aquí.
# Los jobs de macOS solo corren a mano (workflow_dispatch) y una vez por semana (`schedule`), salvo `interfaz`, que en
# los pull requests que tocan las apps las compila y pasa sus pruebas de interfaz. Si una máquina de macOS se pierde a
# mitad, `reintentar.yml` repite los jobs que fallaron (una vez).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # los lunes a las 4:00 (UTC)

permissions:
  contents: read

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xcode de los jobs de macOS: `latest-stable`, o una versión concreta («16.4») para fijarla.
  XCODE: latest-stable

# Los jobs de Linux recuperan el `.build` de la última ejecución en main (`.github/acciones/cache-de-swift`), con las
# fechas de los ficheros arregladas para que Swift recompile solo lo que ha cambiado desde entonces. Solo se guarda
# fuera de los pull requests (en main, a mano y los lunes), para que haya una caché por job y no una por rama.
# Las compilaciones «Sin avisos» van en `.build/sin-avisos`: con otras opciones en la misma carpeta, la siguiente
# compilación normal tendría que rehacerlo todo.

jobs:
  comprobaciones:
    name: Comprobaciones del repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Higiene (invisibles, tabuladores, permisos, scripts que compilan)
        run: python3 Scripts/comprobaciones/comprobar_higiene.py
      - name: Dependencias entre paquetes y apps
        run: python3 Scripts/comprobaciones/comprobar_dependencias.py
      - name: Rutas sin colisiones de mayúsculas
        run: |
          duplicadas=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$duplicadas" ]; then echo "Rutas que solo difieren en mayúsculas:"; echo "$duplicadas"; exit 1; fi
          carpetas=$(git ls-files | xargs -n1 dirname | sort -u | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$carpetas" ]; then echo "Carpetas que solo difieren en mayúsculas:"; echo "$carpetas"; exit 1; fi
      - name: Módulos del motor
        run: python3 Scripts/comprobaciones/comprobar_modulos.py
      - name: Catálogo de escalas
        run: python3 Scripts/comprobaciones/comprobar_catalogo.py
      - name: Enlaces de la documentación (DocC)
        run: python3 Scripts/comprobaciones/comprobar_enlaces_docc.py
      - name: Traducciones
        run: python3 Scripts/comprobaciones/comprobar_traducciones.py
      - name: Package.swift de la raíz al día
        run: python3 Scripts/generadores/generar_paquete_raiz.py --comprobar
      - name: Ejemplos de la documentación al día
        run: python3 Scripts/generadores/generar_pruebas_de_documentacion.py --comprobar
      - name: CHANGELOG (secciones y notas de la versión actual)
        run: python3 Scripts/comprobaciones/notas_de_version.py --comprobar

  # El formato del código Swift, con swift-format (viene con Swift 6) y la configuración de `.swift-format`. Para
  # arreglarlo: `swift format -i -r --parallel Packages Apps Ejemplos Herramientas Package.swift`. Los ficheros que
  # empiezan con `// swift-format-ignore-file` (las tablas de datos y las pruebas generadas) no se tocan.
  formato:
    name: Formato (swift-format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: swift format lint
        run: swift format lint --strict -r --parallel Packages Apps Ejemplos Herramientas Package.swift

  motor:
    name: Armonia · Linux · Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        # La más antigua que admite el paquete y la más reciente: las intermedias no han dado nada distinto.
        swift: ["6.0", "6.2"]
    defaults:
      run:
        working-directory: Packages/Armonia
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/acciones/cache-de-swift
        with:
          nombre: motor-${{ matrix.swift }}
          rutas: |
            Packages/Armonia/.build
      - name: Compilar
        run: swift build
      - name: Pruebas rápidas
        run: swift test --parallel --filter "^(Armonia|Elementos|Teoria|Diagramas|Partituras|Polifonia|Formatos|Trastes)Tests\\."
      - name: Pruebas exhaustivas
        run: swift test --parallel --filter "^ArmoniaExhaustivasTests\\."
      - name: Ejemplos de la documentación
        run: swift test --parallel --filter "^ArmoniaDocumentacionTests\\."
      # El modo de lenguaje 6 ya hace errores los fallos de concurrencia; esto, además, cualquier aviso.
      - name: Sin avisos (módulos)
        if: matrix.swift == '6.2'
        run: |
          for objetivo in Elementos Teoria Diagramas Partituras Polifonia Formatos Trastes Armonia; do
            swift build --scratch-path .build/sin-avisos --target "$objetivo" -Xswiftc -warnings-as-errors
          done
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: |
            Packages/Armonia/.build
          key: ${{ steps.cache.outputs.clave }}

  herramientas:
    name: ${{ matrix.paquete.nombre }} · Linux · Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.2"]
        paquete:
          - { nombre: ConsolaArmonia, ruta: Apps/ConsolaArmonia }
          - { nombre: EjemploArmonia, ruta: Ejemplos/EjemploArmonia }
          - { nombre: EjemploCatalogoDeEscalas, ruta: Ejemplos/EjemploCatalogoDeEscalas }
          - { nombre: EjemploHexagonos, ruta: Ejemplos/EjemploHexagonos }
          - { nombre: RendimientoArmonia, ruta: Herramientas/RendimientoArmonia }
          - { nombre: FuzzArmonia, ruta: Herramientas/FuzzArmonia }
    defaults:
      run:
        working-directory: ${{ matrix.paquete.ruta }}
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/acciones/cache-de-swift
        with:
          nombre: ${{ matrix.paquete.nombre }}-${{ matrix.swift }}
          rutas: |
            ${{ matrix.paquete.ruta }}/.build
      - name: Compilar
        run: swift build
      - name: Pruebas
        if: matrix.paquete.nombre == 'ConsolaArmonia' || matrix.paquete.nombre == 'FuzzArmonia'
        run: swift test --parallel
      - name: Ejemplo
        if: startsWith(matrix.paquete.nombre, 'Ejemplo')
        run: swift run ${{ matrix.paquete.nombre }}
      - name: Sin avisos
        if: matrix.paquete.nombre == 'ConsolaArmonia' && matrix.swift == '6.2'
        run: swift build --scratch-path .build/sin-avisos --target ConsolaArmonia -Xswiftc -warnings-as-errors
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: |
            ${{ matrix.paquete.ruta }}/.build
          key: ${{ steps.cache.outputs.clave }}

  # `armonia grabar` con los programas de verdad: instala LilyPond y rsvg-convert (librsvg) y graba partituras y
  # dibujos en PDF, SVG y PNG, comprobando que cada fichero es lo que dice ser. Las pruebas de ConsolaArmonia usan un
  # ejecutor falso; este job es el que dice que los argumentos y los nombres de los ficheros siguen sirviendo con
  # las versiones de los programas de la distribución. Los ficheros quedan como artefacto (`grabados`).
  # MuseScore, Verovio y Guido no tienen paquete ligero en Ubuntu, así que solo se comprueba que su falta se dice.
  grabado:
    name: Grabado con LilyPond y rsvg-convert · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2
    defaults:
      run:
        shell: bash
        working-directory: Apps/ConsolaArmonia
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/acciones/cache-de-swift
        with:
          nombre: grabado
          rutas: |
            Apps/ConsolaArmonia/.build
      - name: Instalar LilyPond y librsvg
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            lilypond librsvg2-bin fonts-dejavu-core
      - name: Compilar
        run: swift build --product armonia
      - name: Motores instalados
        run: |
          .build/debug/armonia motores | tee motores.txt
          grep -E '^lilypond +/.+ \(GNU LilyPond' motores.txt
          grep -E '^propio +/.+rsvg-convert' motores.txt
          grep -E '^musescore +no instalado .*ARMONIA_MSCORE' motores.txt
          .build/debug/armonia engines --ingles | grep -E '^own +/'
      - name: Grabar
        run: |
          armonia() { .build/debug/armonia "$@"; }
          # Que el fichero exista, no esté vacío y empiece como su formato.
          comprobar() {
            local fichero="$1" formato="$2"
            test -s "$fichero" || { echo "::error::$fichero está vacío"; exit 1; }
            case "$formato" in
              pdf) test "$(head -c 5 "$fichero")" = "%PDF-" ;;
              png) test "$(head -c 8 "$fichero" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a" ;;
              svg) grep -q "<svg" "$fichero" ;;
            esac || { echo "::error::$fichero no es un $formato"; exit 1; }
            echo "$fichero: $formato, $(wc -c < "$fichero") bytes"
          }
          mkdir -p grabados
          armonia grabar coral Do3 Mi4 Sol4 Do5, Fa2 La3 Fa4 Do5, Sol2 Re4 Sol4 Si4, Do3 Mi4 Sol4 Do5 \
            --cifrados --analisis --titulo Cadencia > grabados/coral.pdf
          comprobar grabados/coral.pdf pdf
          armonia grabar melodia Sol4:4 Do5:2 Re5:8 Mi5:8 Fa#5:4 Sol5:2. --compas 3/4 --anacrusa 4 --en Sol mayor \
            --formato svg > grabados/melodia.svg
          comprobar grabados/melodia.svg svg
          armonia grabar acordes Do Lam Re7 Sol7 Do --formato png > grabados/acordes.png
          comprobar grabados/acordes.png png
          armonia engrave chorale C3 E4 G4 C5, G2 D4 G4 B4 --ingles --format pdf > grabados/chorale.pdf
          comprobar grabados/chorale.pdf pdf
          armonia grabar pentagrama escala Re dórico --formato png > grabados/dorico.png
          comprobar grabados/dorico.png png
          armonia grabar pentagrama acorde Sol7 > grabados/sol7.pdf
          comprobar grabados/sol7.pdf pdf
          armonia grabar tonnetz escala Re dórico --formato png > grabados/tonnetz.png
          comprobar grabados/tonnetz.png png
          # Sin MuseScore: código 1 y el mensaje que dice qué falta.
          if armonia grabar coral Do3 Mi4 Sol4 Do5 --motor musescore > /dev/null 2> error.txt; then
            echo "::error::grabar con MuseScore no debería funcionar sin MuseScore"; exit 1
          fi
          cat error.txt
          grep -q "ARMONIA_MSCORE" error.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grabados
          path: Apps/ConsolaArmonia/grabados
          if-no-files-found: ignore
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: |
            Apps/ConsolaArmonia/.build
          key: ${{ steps.cache.outputs.clave }}

  # Los tiempos del motor, compilado con optimización, en el resumen de la ejecución y como artefacto
  # (`rendimiento.json`). En un pull request mide también la rama de destino (main) en la misma máquina, una
  # detrás de otra, y avisa (sin fallar) de los casos que van más de un 25 % más lentos que en main, en la
  # mediana y en el mínimo: las máquinas del CI varían demasiado para fijar límites absolutos, pero dos medidas
  # seguidas en la misma sí se pueden comparar.
  rendimiento:
    name: Rendimiento del motor · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/acciones/cache-de-swift
        with:
          nombre: rendimiento
          rutas: |
            Herramientas/RendimientoArmonia/.build
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Medir la rama de destino
        if: github.event_name == 'pull_request'
        working-directory: base/Herramientas/RendimientoArmonia
        run: swift run -c release RendimientoArmonia --json "$RUNNER_TEMP/base.json" > /dev/null
      - name: Compilar con optimización
        working-directory: Herramientas/RendimientoArmonia
        run: swift build -c release
      - name: Medir
        working-directory: Herramientas/RendimientoArmonia
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -o pipefail
          comparar=()
          if [ -f "$RUNNER_TEMP/base.json" ]; then
            comparar=(--comparar "$RUNNER_TEMP/base.json" --avisar 25)
            echo "## Rendimiento del motor (comparado con $BASE)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Rendimiento del motor" >> "$GITHUB_STEP_SUMMARY"
          fi
          swift run -c release RendimientoArmonia --json "$GITHUB_WORKSPACE/rendimiento.json" "${comparar[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: rendimiento
          path: rendimiento.json
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: |
            Herramientas/RendimientoArmonia/.build
          key: ${{ steps.cache.outputs.clave }}

  paquetes:
    name: ${{ matrix.paquete }} · Linux · Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.2"]
        paquete: [Exposicion, Interfaz, Hexagonos]
    defaults:
      run:
        working-directory: Packages/${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/acciones/cache-de-swift
        with:
          nombre: ${{ matrix.paquete }}-${{ matrix.swift }}
          rutas: |
            Packages/${{ matrix.paquete }}/.build
      - name: Compilar
        run: swift build
      - name: Pruebas
        run: swift test --parallel
      - name: Sin avisos
        if: matrix.paquete == 'Hexagonos' && matrix.swift == '6.2'
        run: swift build --scratch-path .build/sin-avisos --target Hexagonos -Xswiftc -warnings-as-errors
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: |
            Packages/${{ matrix.paquete }}/.build
          key: ${{ steps.cache.outputs.clave }}

  # La cobertura de las pruebas de cada paquete en Linux: el total y los ficheros con menos líneas probadas, en
  # el resumen de la ejecución, y el informe entero por fichero como artefacto (`cobertura-<paquete>.txt`).
  # Falla si el porcentaje de funciones o de líneas probadas baja del mínimo del paquete (`funciones` y `lineas`,
  # un poco por debajo de lo que se tiene, para que un cambio sin pruebas no lo haga bajar). Si sube, sube el mínimo.
  cobertura:
    name: Cobertura · ${{ matrix.paquete.nombre }} · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.2
    strategy:
      fail-fast: false
      matrix:
        paquete:
          # Las exhaustivas tardan y no prueban código distinto del de las rápidas.
          - { nombre: Armonia, filtro: "^(Armonia|ArmoniaDocumentacion|Elementos|Teoria|Diagramas|Partituras|Polifonia|Formatos|Trastes)Tests\\.", funciones: 95.5, lineas: 98.0 }
          - { nombre: Exposicion, filtro: "", funciones: 96.5, lineas: 96.0 }
          - { nombre: Interfaz, filtro: "", funciones: 97.0, lineas: 99.0 }
          - { nombre: Hexagonos, filtro: "", funciones: 93.5, lineas: 97.5 }
    defaults:
      run:
        working-directory: Packages/${{ matrix.paquete.nombre }}
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/acciones/cache-de-swift
        with:
          nombre: cobertura-${{ matrix.paquete.nombre }}
          rutas: |
            Packages/${{ matrix.paquete.nombre }}/.build
      - name: Pruebas con cobertura
        env:
          FILTRO: ${{ matrix.paquete.filtro }}
        # Sin los datos de cobertura que trae la caché, que se sumarían a los de ahora.
        run: |
          rm -rf .build/*/debug/codecov
          swift test --parallel --enable-code-coverage ${FILTRO:+--filter "$FILTRO"}
      - name: Informe
        env:
          PAQUETE: ${{ matrix.paquete.nombre }}
        run: |
          set -euo pipefail
          binarios=$(swift build --show-bin-path)
          pruebas=$(ls -d "$binarios"/*PackageTests.xctest | head -n 1)
          informe="$GITHUB_WORKSPACE/cobertura-$PAQUETE.txt"
          # Solo el código del paquete (Sources), no el de las pruebas ni el de los paquetes de los que depende.
          llvm-cov report "$pruebas" -instr-profile="$binarios/codecov/default.profdata" "$PWD/Sources" > "$informe"
          {
            # Sin `head`: al cerrar la tubería antes de que `sort` acabe de escribir, `sort` muere con SIGPIPE y,
            # con pipefail, el paso falla (código 141).
            echo "## Cobertura de $PAQUETE"
            echo
            echo "| | Funciones | Líneas |"
            echo "|---|---:|---:|"
            awk '$1 == "TOTAL" { print "| **Total** | " $7 " | " $10 " |" }' "$informe"
            awk '$1 != "TOTAL" && $1 != "Filename" && $1 !~ /^-+$/ && NF >= 10 { sub("%", "", $10); print $10 " " $1 " " $7 }' "$informe" \
              | sort -n | awk 'NR <= 15 { print "| `" $2 "` | " $3 " | " $1 "% |" }'
            echo
            echo "Arriba, el total y los 15 ficheros con menos líneas probadas. El informe entero está en el artefacto."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mínimos
        env:
          PAQUETE: ${{ matrix.paquete.nombre }}
          FUNCIONES: ${{ matrix.paquete.funciones }}
          LINEAS: ${{ matrix.paquete.lineas }}
        run: |
          set -euo pipefail
          awk -v f="$FUNCIONES" -v l="$LINEAS" -v p="$PAQUETE" '$1 == "TOTAL" {
            sub("%", "", $7); sub("%", "", $10)
            mal = 0
            if ($7 + 0 < f + 0) { printf "::error::%s: %s%% de funciones probadas, por debajo del mínimo (%s%%)\n", p, $7, f; mal = 1 }
            if ($10 + 0 < l + 0) { printf "::error::%s: %s%% de líneas probadas, por debajo del mínimo (%s%%)\n", p, $10, l; mal = 1 }
            if (!mal) printf "%s: %s%% de funciones (mínimo %s%%) y %s%% de líneas (mínimo %s%%)\n", p, $7, f, $10, l
            exit mal
          }' "$GITHUB_WORKSPACE/cobertura-$PAQUETE.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-${{ matrix.paquete.nombre }}
          path: cobertura-${{ matrix.paquete.nombre }}.txt
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: |
            Packages/${{ matrix.paquete.nombre }}/.build
          key: ${{ steps.cache.outputs.clave }}

  # El Package.swift de la raíz, el que usa quien añade el repositorio por URL: debe compilar igual.
  raiz:
    name: Paquete de la raíz · Linux · Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.2"]
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/acciones/cache-de-swift
        with:
          nombre: raiz-${{ matrix.swift }}
          rutas: |
            .build
      - name: Compilar
        run: swift build
      - uses: actions/cache/save@v6
        if: github.event_name != 'pull_request'
        with:
          path: |
            .build
          key: ${{ steps.cache.outputs.clave }}

  # Un pull request que cambia las apps, sus vistas (Interfaz) o el proyecto de Xcode pasa `interfaz`, que compila
  # las dos apps en macOS y en el simulador de iOS antes de probarlas: es lo que Linux no puede compilar. Lo demás de
  # macOS sigue en el job `macos`. `cambios-en-las-apps` corre en Linux y solo mira los ficheros, para no ocupar un
  # runner de macOS en los demás.
  cambios-en-las-apps:
    name: ¿Toca las apps?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.mirar.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: mirar
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cambiados=$(git diff --name-only "$BASE"...HEAD)
          echo "$cambiados"
          if echo "$cambiados" | grep -qE '^(Apps/ArsHarmonicaApp/|Apps/TonnetzApp/|Apps/PruebasDeInterfaz/|Packages/Interfaz/|Packages/Exposicion/|project\.yml$|Scripts/generadores/generar_proyecto\.sh$)'; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps=false" >> "$GITHUB_OUTPUT"
          fi

  # Los jobs de macOS (este, las pruebas de interfaz y DocC) son los que más tardan: corren a mano desde la
  # pestaña Actions y los lunes, no en cada push ni en cada pull request. Un pull request que toque las apps ya las
  # compila y pasa sus pruebas de interfaz en `interfaz`; para las pruebas de los paquetes en macOS, la
  # compilación para el simulador de iOS o la documentación, se lanzan a mano en su rama.
  macos:
    name: macOS · paquetes y apps
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE }}
      - name: Versión de Swift y de Xcode
        run: swift --version && xcodebuild -version
      - name: Armonia
        run: swift build && swift test --parallel --filter "^(Armonia|Elementos|Teoria|Diagramas|Partituras|Polifonia|Formatos|Trastes)Tests\\."
        working-directory: Packages/Armonia
      - name: Exposicion
        run: swift test --parallel
        working-directory: Packages/Exposicion
      - name: Interfaz
        run: swift test --parallel
        working-directory: Packages/Interfaz
      - name: Hexagonos
        run: swift test --parallel
        working-directory: Packages/Hexagonos
      - name: Línea de comandos y ejemplos
        run: |
          (cd Apps/ConsolaArmonia && swift test --parallel)
          (cd Ejemplos/EjemploArmonia && swift run EjemploArmonia > /dev/null)
          (cd Ejemplos/EjemploCatalogoDeEscalas && swift run EjemploCatalogoDeEscalas - > /dev/null)
          (cd Ejemplos/EjemploHexagonos && swift run EjemploHexagonos > /dev/null)
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar el proyecto
        run: ./Scripts/generadores/generar_proyecto.sh
      - name: Ars Harmonica (macOS)
        run: >
          xcodebuild build -project Tesela.xcodeproj -scheme ArsHarmonicaApp
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Tonnetz (macOS)
        run: >
          xcodebuild build -project Tesela.xcodeproj -scheme TonnetzApp
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      # La App Store rechaza una app sin su manifiesto de privacidad.
      - name: Manifiesto de privacidad en las apps
        run: |
          for app in ArsHarmonicaApp TonnetzApp; do
            manifiesto=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Debug/$app.app/Contents/Resources/PrivacyInfo.xcprivacy" | head -1)
            test -n "$manifiesto" || { echo "::error::$app no lleva PrivacyInfo.xcprivacy"; exit 1; }
            plutil -lint "$manifiesto"
          done
      - name: Ars Harmonica (iOS, simulador)
        run: >
          xcodebuild build -project Tesela.xcodeproj -scheme ArsHarmonicaApp
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Tonnetz (iOS, simulador)
        run: >
          xcodebuild build -project Tesela.xcodeproj -scheme TonnetzApp
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      # Los doce idiomas, en el Info.plist y como carpetas .lproj, en cada app de iOS.
      - name: Idiomas de las apps
        run: |
          for app in ArsHarmonicaApp TonnetzApp; do
            paquete=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Debug-iphonesimulator/$app.app" | head -1)
            test -n "$paquete" || { echo "::error::No encuentro $app.app"; exit 1; }
            idiomas=$(plutil -extract CFBundleLocalizations json -o - "$paquete/Info.plist" | python3 -c 'import json, sys; print(len(json.load(sys.stdin)))')
            carpetas=$(ls -d "$paquete"/*.lproj | wc -l | tr -d ' ')
            echo "$app: $idiomas idiomas en el Info.plist, $carpetas carpetas .lproj"
            test "$idiomas" -eq 12 && test "$carpetas" -ge 12 || { echo "::error::$app no declara los doce idiomas"; exit 1; }
          done

  # Las pruebas de interfaz corren también en los pull requests que cambian las apps, para que una vista nueva o
  # cambiada no espere al lunes. `xcodebuild test` compila antes cada app (en macOS y para el simulador de iOS), así
  # que un fallo de compilación también lo da este job: no hace falta otra máquina de macOS solo para compilar. `!cancelled()` hace falta porque fuera de los pull
  # requests `cambios-en-las-apps` no corre, y sin él este job se saltaría también a mano y los lunes.
  interfaz:
    name: Pruebas de interfaz · ${{ matrix.plataforma }}
    needs: cambios-en-las-apps
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
      || needs.cambios-en-las-apps.outputs.apps == 'true')
    runs-on: macos-15
    timeout-minutes: 45
    # macOS e iOS en paralelo: una tras otra tardaban unos 21 minutos.
    strategy:
      fail-fast: false
      matrix:
        plataforma: [macOS, iOS]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE }}
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar el proyecto
        run: ./Scripts/generadores/generar_proyecto.sh
      - name: Permitir que las pruebas manejen las apps
        if: matrix.plataforma == 'macOS'
        run: sudo automationmodetool enable-automationmode-without-authentication
      # El primer iPhone del simulador que tenga el Xcode instalado, para no fijar un modelo que desaparezca.
      - name: Elegir el simulador
        if: matrix.plataforma == 'iOS'
        run: |
          iphone=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]*[^ (]')
          echo "Simulador: $iphone"
          echo "SIMULADOR=platform=iOS Simulator,name=$iphone" >> "$GITHUB_ENV"
          # Arrancado de antemano: si no, la primera prueba puede agotar el minuto que se da para abrir la app.
          xcrun simctl boot "$iphone"
          xcrun simctl bootstatus "$iphone" -b
      # En macOS el ejecutor de las pruebas tiene que estar firmado: se firma sin equipo («-»).
      # En iOS una prueba que falla se repite una vez: el simulador del CI a veces no deja abrir la app
      # («Timed out while acquiring background assertion»), y un fallo de verdad falla también la segunda.
      - name: Ars Harmonica
        run: |
          if [ "${{ matrix.plataforma }}" = macOS ]; then
            xcodebuild test -project Tesela.xcodeproj -scheme ArsHarmonicaApp -destination 'platform=macOS' \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          else
            xcodebuild test -project Tesela.xcodeproj -scheme ArsHarmonicaApp -destination "$SIMULADOR" \
              CODE_SIGNING_ALLOWED=NO -retry-tests-on-failure -test-iterations 2
          fi
      - name: Tonnetz
        run: |
          if [ "${{ matrix.plataforma }}" = macOS ]; then
            xcodebuild test -project Tesela.xcodeproj -scheme TonnetzApp -destination 'platform=macOS' \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          else
            xcodebuild test -project Tesela.xcodeproj -scheme TonnetzApp -destination "$SIMULADOR" \
              CODE_SIGNING_ALLOWED=NO -retry-tests-on-failure -test-iterations 2
          fi

  documentacion:
    name: DocC · macOS
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE }}
      - name: Construir la documentación
        working-directory: Packages/Armonia
        run: |
          set -o pipefail
          xcodebuild docbuild -scheme Armonia-Package -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/docc" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/docbuild.log"
      - name: Construir la documentación de Hexagonos
        working-directory: Packages/Hexagonos
        run: |
          set -o pipefail
          # Con un solo producto, el esquema se llama como él (sin «-Package»).
          xcodebuild docbuild -scheme Hexagonos -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/docc-hexagonos" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/docbuild-hexagonos.log"
      - name: Construir la documentación de Exposicion
        working-directory: Packages/Exposicion
        run: |
          set -o pipefail
          # Con un solo producto, el esquema se llama como él (sin «-Package»).
          xcodebuild docbuild -scheme Exposicion -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/docc-exposicion" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/docbuild-exposicion.log"
      - name: Construir la documentación de Interfaz
        working-directory: Packages/Interfaz
        run: |
          set -o pipefail
          xcodebuild docbuild -scheme Interfaz -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/docc-interfaz" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/docbuild-interfaz.log"
      - name: Enlaces sin resolver
        run: |
          if grep -E "warning: .*(doesn.t exist|couldn.t be resolved|unresolved|not found)" "$RUNNER_TEMP"/docbuild*.log; then
            echo "::warning::Hay enlaces de DocC sin resolver (¿símbolos reexportados por el módulo Armonia?)"
            exit 1
          fi
