name: Versión

# Al subir una etiqueta de versión («0.2.0» o «v0.2.0») crea su release en GitHub con las notas de la sección de
# esa versión en el CHANGELOG.md de cada paquete (`Scripts/notas_de_version.py`). Falla, sin crear nada, si
# ningún CHANGELOG la tiene o si no coincide con MARKETING_VERSION de project.yml. Si la release ya existe, no la
# toca. A mano (workflow_dispatch) crea la de una etiqueta que ya está subida.
#
# Para publicar una versión, pasa lo que está en «## Sin publicar» de los CHANGELOG a la versión y sube
# MARKETING_VERSION en project.yml (el script hace las dos cosas), fusiona en main y etiqueta ese commit:
#
#     python3 Scripts/notas_de_version.py --publicar 0.2.0
#     git tag 0.2.0 && git push origin 0.2.0
#
# La misma etiqueta publica también la documentación (documentacion.yml).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta ya subida (por ejemplo 0.2.0)
        required: true

permissions:
  contents: write

concurrency:
  group: version-${{ inputs.etiqueta || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.etiqueta || github.ref_name }}
      - name: Notas del CHANGELOG
        run: python3 Scripts/notas_de_version.py "$ETIQUETA" > "$RUNNER_TEMP/notas.md"
      - name: Crear la release
        run: |
          set -euo pipefail
          if gh release view "$ETIQUETA" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::La release $ETIQUETA ya existe; no se cambia."
            exit 0
          fi
          gh release create "$ETIQUETA" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tesela ${ETIQUETA#v}" --notes-file "$RUNNER_TEMP/notas.md"
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$ETIQUETA" >> "$GITHUB_STEP_SUMMARY"
