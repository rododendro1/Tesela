name: Error
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: textarea
    id: que_pasa
    attributes:
      label: Qué pasa
      description: Qué has hecho, qué esperabas y qué ha pasado.
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: El cifrado, la escala, la orden de `armonia` o el fichero que lo provoca, o el código mínimo.
      render: text
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: Dónde
      multiple: true
      options:
        - ArmoniaApp
        - TonnetzApp
        - Línea de comandos (armonia)
        - Paquete Armonia
        - Paquete ArmoniaUI
        - Paquete Hexagonos
        - Documentación
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: La versión de Tesela (o el commit de main) y la de Swift o Xcode.
      placeholder: 0.1.0, Swift 6.2
    validations:
      required: true
  - type: input
    id: plataforma
    attributes:
      label: Plataforma
      placeholder: macOS 15, iOS 18, Ubuntu 24.04…
